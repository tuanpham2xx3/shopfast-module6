name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopfast-production
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate registry with ephemeral job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish exact commit
        run: |
          docker build -f deploy/containers/Dockerfile --target runtime -t ghcr.io/tuanpham2xx3/shopfast-module6-app:$GITHUB_SHA .
          docker build -f deploy/containers/Dockerfile --target web -t ghcr.io/tuanpham2xx3/shopfast-module6-web:$GITHUB_SHA .
          docker push ghcr.io/tuanpham2xx3/shopfast-module6-app:$GITHUB_SHA
          docker push ghcr.io/tuanpham2xx3/shopfast-module6-web:$GITHUB_SHA
  deploy:
    needs: images
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume limited deployment role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::321323528839:role/ShopFastGitHubDeploy
          aws-region: ap-southeast-2
      - name: Invoke restricted release document
        run: |
          command_id=$(aws ssm send-command --instance-ids i-05647e511e0e1780b --document-name ShopFastDeploy --parameters "Commit=$GITHUB_SHA" --query Command.CommandId --output text)
          status=Pending
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-05647e511e0e1780b --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success) break;; Failed|Cancelled|TimedOut) exit 1;; esac
            sleep 5
          done
          test "$status" = Success
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-05647e511e0e1780b --query '{Status:Status,ResponseCode:ResponseCode}'
