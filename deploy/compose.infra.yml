name: shopfast
services:
  postgres:
    image: postgres:16.13-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopfast
      POSTGRES_USER: shopfast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U shopfast -d shopfast"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 2g
  redis:
    image: redis:7.4.8-bookworm
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
volumes:
  postgres_data:
  redis_data:
