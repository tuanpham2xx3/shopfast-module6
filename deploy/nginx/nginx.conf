map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 80;
  server_name shopfast.tuanpq.com;
  client_max_body_size 64k;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://shopfast.tuanpq.com$request_uri; }
}
server {
  listen 443 ssl;
  server_name shopfast.tuanpq.com;
  ssl_certificate /etc/letsencrypt/live/shopfast.tuanpq.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shopfast.tuanpq.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  # Nginx >=1.27.4: retain recently idle connections across graceful reload
  # so an in-flight client reuse receives a response instead of a socket reset.
  keepalive_min_timeout 5s;
  keepalive_timeout 10s;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 35s;
  }
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
  }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
